name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chatgpt_gateway/requirements.lock
      - name: Install existing gateway and test dependencies
        run: |
          python -m pip install --require-hashes -r chatgpt_gateway/requirements.lock
          python -m pip install pytest aiohttp
      - name: Run existing Python tests and report skip reasons
        run: python -m pytest tests/ -ra
